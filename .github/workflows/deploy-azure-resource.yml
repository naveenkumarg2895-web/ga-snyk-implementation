# This is a basic workflow to help you get started with Actions
name: Azure Bicep Deployment

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "main" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Runs a single command using the runners shell
      - name: Echo Script
        run: echo Starting Bicep...

      - name: Install Bicep
        run: az bicep install

      - name: Validate Bicep
        run: az bicep build --file main.bicep

      - name: verify Bicep
        run: az bicep lint --file main.bicep        

      - name: Find Bicep files
        run: find . -name "*.bicep"   

      - name: Debug files
        run: |
          pwd
          ls -R
          find . -name "*.bicep"       

      - name: Install Snyk
        run: npm install -g snyk

      - name: Scan Bicep
        run: snyk iac test main.json --report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  
          SNYK_API: https://api.au.snyk.io

            # Build Java application
      - name: Build Java application
        working-directory: java-app
        run: mvn package -DskipTests

      # Build Docker image
      - name: Build Docker image
        run: docker build -t ga-snyk-implementation:latest ./java-app

      # Scan Docker image with Snyk
      - name: Scan Docker image with Snyk
        run: snyk container test ga-snyk-implementation:latest --file=java-app/Dockerfile --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.au.snyk.io

      # Upload Docker image snapshot to Snyk
      - name: Monitor Docker image in Snyk
        if: success()
        run: snyk container monitor ga-snyk-implementation:latest --file=java-app/Dockerfile
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_API: https://api.au.snyk.io